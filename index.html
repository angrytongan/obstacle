<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>obstacle</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .app-header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid #8884;
      }
      .app-header .icon-bike {
        font-size: 1.3rem;
        line-height: 1;
      }
      .app-header .app-title {
        font-weight: 700;
        font-size: 1rem;
      }
      .app-header .spacer {
        flex: 1;
      }
      .app-header .pill {
        background: #cf222e1a;
        color: #cf222e;
        border: 1px solid #cf222e55;
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
        font-size: 0.75rem;
        white-space: nowrap;
      }
      .app-header .icon-link {
        display: flex;
        color: inherit;
        opacity: 0.75;
      }
      .app-header .icon-link:hover {
        opacity: 1;
      }
      .app {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      #panel,
      .main-tabs {
        border-radius: 10px;
        border: 1px solid #8884;
        background: #80808010;
        box-shadow: 0 1px 4px #0003;
        position: relative; /* #panel needs this above .main-tabs in stacking order, so its tooltips render on top of the 3D canvas */
      }
      #panel {
        width: 260px;
        flex-shrink: 0;
        padding: 1rem;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 1;
      }
      #type-select,
      #method-select {
        width: 100%;
        padding: 0.4rem;
        margin-bottom: 1rem;
      }
      .slider-row {
        margin-bottom: 0.9rem;
      }
      .slider-row label {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
      }
      .slider-row input[type="range"] {
        width: 100%;
      }
      #reset-btn {
        width: 100%;
        padding: 0.4rem;
        margin-bottom: 1rem;
        cursor: pointer;
      }
      .history-buttons {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .history-buttons button {
        flex: 1;
        padding: 0.4rem;
        cursor: pointer;
      }
      .history-buttons button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .method-option-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      .method-option-heading {
        opacity: 0.75;
        margin-top: 0.6rem;
        margin-bottom: 0.4rem;
      }
      .wireframe-row {
        margin-left: 1.2rem;
        margin-bottom: 0.4rem;
      }
      #method-options > .wireframe-row:last-child {
        margin-bottom: 1rem;
      }
      #method-options:empty {
        margin-bottom: 0;
      }
      .main-tabs {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* clips tab-panel content (e.g. the canvas) to the card's rounded corners */
      }
      .tab-bar {
        flex-shrink: 0;
        display: flex;
        border-bottom: 1px solid #8884;
      }
      .tab-btn {
        background: none;
        border: none;
        padding: 0.6rem 1rem;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: inherit;
        opacity: 0.6;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tab-btn[aria-selected="true"] {
        opacity: 1;
        border-bottom-color: currentColor;
      }
      .tab-panel {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #viewport canvas {
        display: block;
      }
      #drawings-list,
      #bom-container {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      #drawings-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
        gap: 1.5rem;
        align-content: start;
      }
      .drawing-card h3 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      .drawing-card svg {
        width: 100%;
        aspect-ratio: 1;
        background: #80808010;
        border: 1px solid #8884;
        border-radius: 6px;
      }
      .part-outline {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5px;
        vector-effect: non-scaling-stroke;
      }
      .dim-extension,
      .dim-line {
        stroke: #cf222e;
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
      }
      .dim-arrow {
        fill: #cf222e;
      }
      .dim-label,
      .part-note {
        fill: currentColor;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      #bom-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      #bom-table th,
      #bom-table td {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #8884;
      }
      #bom-table th {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.6;
      }
      #bom-table td.bom-qty {
        font-variant-numeric: tabular-nums;
      }
      .bom-status {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.8rem;
        margin-bottom: 0.75rem;
      }
      /* [hidden] and .bom-status both have one-selector specificity, and author styles win
         that tie over the UA stylesheet's [hidden] { display: none }, so .bom-status's own
         `display` would otherwise always beat `.hidden = true` — this rule's extra ID
         selector breaks the tie back in `hidden`'s favor. */
      #rideability-warning[hidden] {
        display: none;
      }
      .bom-status.safe {
        background: #1a7f371a;
        color: #1a7f37;
      }
      .bom-status.unsafe {
        background: #cf222e1a;
        color: #cf222e;
      }
      .bom-disclaimer {
        font-size: 0.75rem;
        opacity: 0.7;
        font-style: italic;
      }
      .bom-unavailable {
        opacity: 0.7;
        font-style: italic;
      }
      .info-icon {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1px solid currentColor;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 0.65rem;
        line-height: 1;
        padding: 0;
        margin-left: 0.15rem;
        cursor: help;
      }
      /*
        A shared tooltip element positioned in JS from the hovered/focused icon's
        getBoundingClientRect(), appended directly to <body> rather than anchored inside
        the icon — #panel needs overflow-y:auto to scroll, and any ancestor with
        non-visible overflow clips an absolutely-positioned descendant that pops outside
        its bounds, no matter its z-index. position:fixed here escapes that entirely.
      */
      #tooltip {
        position: fixed;
        max-width: 200px;
        background: #1c1c1c;
        border: 1px solid #555;
        color: #fff;
        padding: 0.4rem 0.55rem;
        border-radius: 4px;
        font-size: 0.7rem;
        text-align: left;
        visibility: hidden;
        pointer-events: none;
        z-index: 1000;
        transform: translate(-50%, calc(-100% - 8px));
      }
      #tooltip.visible {
        visibility: visible;
      }
      /* Only the active tab's content is meant to leave the browser: the header, options panel,
         and tab bar are on-screen chrome with nothing to print (hidden here regardless of which
         tab is active), and each tab-panel's own layout below is positioned/sized for a screen
         viewport, not a page flow that a printer can paginate across multiple sheets. The
         inactive tab-panels are already `hidden` by main.ts's tab-switching code, so only the
         visible one ever reaches this stylesheet. Placed last in the stylesheet (after
         .part-outline, .dim-*, and .drawing-card h3's own unconditional rules) so it actually
         wins the cascade at equal specificity. Ported from ../half-pipe/index.html, which
         shares this exact tab/drawing-card/bom-container structure. CAUTION: this comment must
         never contain the literal sequence "*" followed immediately by "/" — that closes the
         comment early and silently voids this entire @media print block (half-pipe shipped that
         bug for a while before catching it). */
      @media print {
        .app-header,
        #panel,
        .tab-bar,
        #tooltip {
          display: none;
        }
        body,
        .app,
        .main-tabs {
          height: auto;
          overflow: visible;
        }
        .app {
          display: block;
          padding: 0;
        }
        .main-tabs {
          border: none;
          box-shadow: none;
        }
        /* three.js sets the canvas's width/height as inline styles sized for the screen
           viewport — !important is needed to win over those for the printed page. */
        #viewport canvas {
          width: 100% !important;
          height: auto !important;
        }
        /* Same on-screen positioning (absolute, inset: 0, clipped to the scrolling container)
           as #drawings-list had before its own print fix — without this, the table would be
           clipped to whatever fit the screen viewport instead of flowing across pages. */
        #bom-container {
          position: static;
          overflow: visible;
          padding: 0;
        }
        /* display: block (not grid) — print/page fragmentation (break-inside, break-after)
           inside a CSS Grid container is inconsistently supported across browsers (Safari's
           print engine especially), and no amount of tuning row/gap sizing on top of a grid
           fixed the drift seen here (cards progressively sliding down until one crosses a page
           break) in half-pipe, where this was first worked out. Plain block flow is the
           best-supported fragmentation context, so the print path drops the grid entirely
           instead of trying to make one work. */
        #drawings-list {
          display: block;
          position: static;
          overflow: visible;
          padding: 0;
        }
        /* Deliberately not sized to fill the page (no vh/height math): a fixed vh height on the
           card or svg assumes `vh` in print equals the printable area, but that area is the
           paper size minus the browser's own print margins — a mismatch there oversizes every
           card by the same fixed amount, and that error compounds page after page, drifting
           each successive card further down until one crosses a page break. Sizing the svg at
           its natural on-screen width/aspect-ratio instead sidesteps needing to know the
           printable area's exact height at all — break-inside/break-after below are the only
           things doing pagination work. Legacy page-break-* properties alongside the modern
           break-* ones since older print-engine code paths (still exercised by some browsers'
           print preview) key off those instead. */
        .drawing-card {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        .drawing-card:not(:last-child) {
          break-after: page;
          page-break-after: always;
        }
        .drawing-card svg {
          border: none;
          background: #fff;
        }
        /* Printed drawings need to read as plain black-on-white regardless of the app's own
           theme colors (currentColor/#cf222e can render as a light tint against a printer's
           interpretation of "screen" colors) — paper has no dark mode. */
        .drawing-card h3 {
          color: #000;
        }
        .part-outline,
        .dim-extension,
        .dim-line {
          stroke: #000;
        }
        .dim-arrow,
        .dim-label,
        .part-note {
          fill: #000;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <span class="icon-bike" role="img" aria-label="Person mountain biking">🚵</span>
      <span class="app-title">obstacle</span>
      <div class="spacer"></div>
      <span class="pill">in development</span>
      <a
        class="icon-link"
        href="https://github.com/angrytongan/obstacle"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </header>
    <div class="app">
      <div id="panel">
        <div class="history-buttons">
          <button type="button" id="undo-btn" disabled>Undo</button>
          <button type="button" id="redo-btn" disabled>Redo</button>
        </div>
        <select id="type-select">
          <option value="roller">Roller</option>
          <option value="berm">Berm</option>
          <option value="kicker">Kicker</option>
        </select>
        <select id="method-select"></select>
        <div id="sliders"></div>
        <div id="rideability-warning" class="bom-status unsafe" hidden></div>
        <div id="method-options"></div>
        <button type="button" id="reset-btn">Reset to defaults</button>
      </div>
      <div class="main-tabs">
        <div class="tab-bar" role="tablist">
          <button type="button" class="tab-btn" role="tab" aria-selected="true" aria-controls="viewport">
            3D view
          </button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-drawings">
            2D drawings
          </button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-bom">
            Bill of materials
          </button>
        </div>
        <div id="viewport" class="tab-panel" role="tabpanel"></div>
        <div id="tab-drawings" class="tab-panel" role="tabpanel" hidden>
          <div id="drawings-list"></div>
        </div>
        <div id="tab-bom" class="tab-panel" role="tabpanel" hidden>
          <div id="bom-container"></div>
        </div>
      </div>
    </div>
    <div id="tooltip" role="tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
